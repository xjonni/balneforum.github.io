<!DOCTYPE html>
<html>
<head>
    <title>BalneForum</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial; max-width: 800px; margin: auto; padding: 20px; background: #f0f0f0; }
        .card { background: white; padding: 20px; border-radius: 10px; margin: 20px 0; }
        button { background: #2ecc71; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>🍄 BalneForum</h1>
    <div class="card">
        <h2>📌 Denúncias e Suporte</h2>
        <p>Clique no botão abaixo para abrir uma denúncia de hacker, bug ou apelação.</p>
        <button onclick="window.open('https://github.com/balneforum/balneforum.github.io/issues')">Abrir Denúncia</button>
    </div>
</body>
</html>
